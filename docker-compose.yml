services:
  # === DMZ: Public-facing Reverse Proxy ===
  proxy:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - web
    networks:
      - dmz
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

  # === DMZ: Web Application (Public-facing server) ===
  # TIDAK exposed langsung ke host - akses HANYA via proxy
  web:
    build: .
    restart: unless-stopped
    environment:
      - DB_NAME=vulnerable_bank
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_HOST=db
      - DB_PORT=5432
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./static/uploads:/app/static/uploads
    networks:
      - dmz
      - internal
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  # === INTERNAL: Database (Private data - NIK, Biometrik, Rekening) ===
  # Database on-premise simulation - TIDAK exposed ke host
  db:
    image: postgres:13
    restart: unless-stopped
    environment:
      - POSTGRES_DB=vulnerable_bank
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    # NO ports exposed - only accessible from internal network (via web app)
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vulnerable_bank"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

volumes:
  postgres_data:

networks:
  dmz:
    driver: bridge
    labels:
      - "zone=dmz"
      - "description=Public-facing services (proxy, web)"
  internal:
    driver: bridge
    internal: true
    labels:
      - "zone=internal"
      - "description=Restricted - Database with private data (NIK, Biometrik, Rekening)"
